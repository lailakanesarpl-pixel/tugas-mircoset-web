<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>BIODATA</h1>

        <form id="biodataForm">

            <div class="form-group">
                <label for="nama">Nama:</label>
                <input type="text" id="nama" name="nama">
            </div>

            <div class="form-group">
                <label for="alamat">Alamat:</label>
                <textarea id="alamat" name="alamat"></textarea>
            </div>

            <div class="form-group">
                <label for="jurusan">Jurusan:</label>
                <select id="jurusan" name="jurusan">
                    <option value="">-- Pilih Jurusan --</option>
                    <option value="RPL">RPL</option>
                    <option value="TSM">TSM</option>
                    <option value="TKR">TKR</option>
                    <option value="TKJ">TKJ</option>
                    <option value="TEI">TEI</option>
                </select>
            </div>

            <div class="form-group">
                <label>Jenis Kelamin:</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="jenisKelamin" value="Laki-laki">
                        Laki-laki
                    </label>

                    <label>
                        <input type="radio" name="jenisKelamin" value="Perempuan">
                        Perempuan
                    </label>

                    <label>
                        <input type="radio" name="jenisKelamin" value="Boti">
                        Boti
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="tinggi">Tinggi Badan (cm):</label>
                <input type="number" id="tinggi" name="tinggi">
            </div>

            <div class="form-group">
                <label for="berat">Berat Badan (kg):</label>
                <input type="number" id="berat" name="berat">
            </div>

            <div class="form-group">
                <label for="hobi">Hobi:</label>
                <input type="text" id="hobi" name="hobi">
            </div>

           <div class="form-group">
               <label for="nohp">No. HP:</label>
               <input
                  type="text"
                  id="nohp"
                  name="nohp"
                  inputmode="numeric"
                  pattern="[0-9]+"
                  oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                  placeholder="Masukkan nomor HP"
             >
           </div>

            <button type="submit">Simpan</button>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
